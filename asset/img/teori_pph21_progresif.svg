<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#1b854a"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fd6ff"/>
      <stop offset="100%" stop-color="#127699"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb238"/>
      <stop offset="100%" stop-color="#a66e14"/>
    </linearGradient>
    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#a14405"/>
    </linearGradient>
    <linearGradient id="tier5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="620" rx="16" fill="url(#bgGrad2)" stroke="#1c3a57" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="24" y="22" width="432" height="48" rx="10" fill="rgba(63,214,255,0.08)" stroke="rgba(63,214,255,0.3)" stroke-width="1"/>
  <text x="240" y="42" fill="#3fd6ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" letter-spacing="1">TARIF PROGRESIF PPh 21 OP</text>
  <text x="240" y="58" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Undang-Undang HPP No. 7 Tahun 2021</text>

  <!-- Formula Pipeline Bar -->
  <g transform="translate(24, 82)">
    <rect width="432" height="88" rx="10" fill="rgba(10, 24, 40, 0.9)" stroke="#1c3a57" stroke-width="1.2"/>
    <text x="216" y="20" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ALUR MENGHITUNG PPh 21 ORANG PRIBADI</text>

    <!-- Step 1 -->
    <rect x="14" y="30" width="82" height="46" rx="6" fill="rgba(63,214,255,0.1)" stroke="rgba(63,214,255,0.2)"/>
    <text x="55" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Penghasilan</text>
    <text x="55" y="60" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">BRUTO</text>
    <text x="55" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Gaji+Bonus</text>

    <text x="103" y="58" fill="#3fd6ff" font-size="14" font-weight="bold">→</text>

    <!-- Step 2 -->
    <rect x="115" y="30" width="94" height="46" rx="6" fill="rgba(255,178,56,0.1)" stroke="rgba(255,178,56,0.2)"/>
    <text x="162" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">(-) Pengurang</text>
    <text x="162" y="60" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="8.5" text-anchor="middle">Biaya Jabatan 5%</text>
    <text x="162" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Maks 500rb/bln</text>

    <text x="216" y="58" fill="#3fd6ff" font-size="14" font-weight="bold">→</text>

    <!-- Step 3 -->
    <rect x="228" y="30" width="88" height="46" rx="6" fill="rgba(255,77,77,0.1)" stroke="rgba(255,77,77,0.2)"/>
    <text x="272" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">(-) PTKP</text>
    <text x="272" y="60" fill="#ff4d4d" font-family="'Segoe UI', sans-serif" font-size="8.5" text-anchor="middle">TK/0: 54 Jt/thn</text>
    <text x="272" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">+4,5 Jt / tanggungan</text>

    <text x="323" y="58" fill="#3fd6ff" font-size="14" font-weight="bold">=</text>

    <!-- Step 4 -->
    <rect x="334" y="30" width="84" height="46" rx="6" fill="rgba(61,220,132,0.15)" stroke="rgba(61,220,132,0.4)"/>
    <text x="376" y="47" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">PKP</text>
    <text x="376" y="60" fill="#3ddc84" font-family="'Segoe UI', sans-serif" font-size="8.5" text-anchor="middle">Kena Pajak</text>
    <text x="376" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="7.5" text-anchor="middle">Dibulatkan ribuan</text>
  </g>

  <!-- Title Ladder -->
  <text x="240" y="196" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="1">5 LAPIS TARIF BERJENJANG (PROGRESIF)</text>

  <!-- Bracket 5: > 5 Miliar (35%) -->
  <g transform="translate(40, 210)">
    <rect width="400" height="48" rx="8" fill="rgba(255,77,77,0.08)" stroke="rgba(255,77,77,0.3)" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="32" rx="6" fill="url(#tier5Grad)"/>
    <text x="38" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">35%</text>
    <text x="76" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Lapis 5: Di atas Rp 5.000.000.000</text>
    <text x="76" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Penghasilan super kaya (*High Net Worth Individuals*)</text>
  </g>

  <!-- Bracket 4: > 500 Jt - 5 M (30%) -->
  <g transform="translate(40, 266)">
    <rect width="400" height="48" rx="8" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.3)" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="32" rx="6" fill="url(#tier4Grad)"/>
    <text x="38" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">30%</text>
    <text x="76" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Lapis 4: > Rp 500 Juta s.d. Rp 5 Miliar</text>
    <text x="76" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Hanya selisih di atas Rp500 Juta yang dikalikan 30%</text>
  </g>

  <!-- Bracket 3: > 250 Jt - 500 Jt (25%) -->
  <g transform="translate(40, 322)">
    <rect width="400" height="48" rx="8" fill="rgba(255,178,56,0.08)" stroke="rgba(255,178,56,0.3)" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="32" rx="6" fill="url(#tier3Grad)"/>
    <text x="38" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">25%</text>
    <text x="76" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Lapis 3: > Rp 250 Juta s.d. Rp 500 Juta</text>
    <text x="76" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Maksimal pajak pada lapis ini = 25% × 250 Jt = Rp62,5 Jt</text>
  </g>

  <!-- Bracket 2: > 60 Jt - 250 Jt (15%) -->
  <g transform="translate(40, 378)">
    <rect width="400" height="48" rx="8" fill="rgba(63,214,255,0.08)" stroke="rgba(63,214,255,0.3)" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="32" rx="6" fill="url(#tier2Grad)"/>
    <text x="38" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">15%</text>
    <text x="76" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Lapis 2: > Rp 60 Juta s.d. Rp 250 Juta</text>
    <text x="76" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Maksimal pajak pada lapis ini = 15% × 190 Jt = Rp28,5 Jt</text>
  </g>

  <!-- Bracket 1: 0 - 60 Jt (5%) -->
  <g transform="translate(40, 434)">
    <rect width="400" height="48" rx="8" fill="rgba(61,220,132,0.1)" stroke="rgba(61,220,132,0.4)" stroke-width="1.2"/>
    <rect x="10" y="8" width="56" height="32" rx="6" fill="url(#tier1Grad)"/>
    <text x="38" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5%</text>
    <text x="76" y="24" fill="#3ddc84" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Lapis 1: Rp 0 s.d. Rp 60.000.000</text>
    <text x="76" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Batas lapis dasar naik dari 50 Jt ke 60 Jt di UU HPP (Maks 3 Jt)</text>
  </g>

  <!-- Key Concept Callout -->
  <g transform="translate(40, 498)">
    <rect width="400" height="96" rx="10" fill="rgba(255,178,56,0.06)" stroke="rgba(255,178,56,0.3)" stroke-width="1"/>
    <text x="20" y="24" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">💡 PRINSIP PENTING TARIF PROGRESIF:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9.5">Setiap orang dihitung mulai dari lapis 1 (5%) terlebih dahulu.</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9.5">Hanya bagian penghasilan yang LEBIH dari Rp60 Juta yang masuk ke lapis 15%.</text>
    <text x="20" y="78" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Contoh PKP 70 Jt = (5% × 60 Jt = 3 Jt) + (15% × 10 Jt = 1,5 Jt) = Rp 4,5 Juta.</text>
  </g>
</svg>
