<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="pbbCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 58, 87, 0.6)"/>
      <stop offset="100%" stop-color="rgba(10, 24, 40, 0.8)"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="620" rx="16" fill="url(#bgGrad3)" stroke="#1c3a57" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="24" y="22" width="432" height="48" rx="10" fill="rgba(63,214,255,0.08)" stroke="rgba(63,214,255,0.3)" stroke-width="1"/>
  <text x="240" y="42" fill="#3fd6ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" letter-spacing="1">MEKANISME PENGHITUNGAN PBB-P2</text>
  <text x="240" y="58" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Pajak Bumi dan Bangunan Perdesaan &amp; Perkotaan</text>

  <!-- Objek PBB: Tanah + Bangunan -->
  <g transform="translate(36, 82)">
    <rect width="408" height="96" rx="10" fill="url(#pbbCard)" stroke="#1c3a57" stroke-width="1.2"/>
    <text x="204" y="22" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">1. PENETAPAN OBJEK PAJAK &amp; TOTAL NJOP</text>

    <!-- Sub 1: Tanah -->
    <rect x="14" y="32" width="180" height="52" rx="8" fill="rgba(61,220,132,0.1)" stroke="rgba(61,220,132,0.3)"/>
    <text x="26" y="52" font-size="16">🏞️</text>
    <text x="50" y="50" fill="#3ddc84" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">NJOP Tanah (Bumi)</text>
    <text x="50" y="68" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">Luas Tanah × Nilai Jual/m²</text>

    <text x="200" y="62" fill="#ffffff" font-size="16" font-weight="bold">+</text>

    <!-- Sub 2: Bangunan -->
    <rect x="214" y="32" width="180" height="52" rx="8" fill="rgba(63,214,255,0.1)" stroke="rgba(63,214,255,0.3)"/>
    <text x="226" y="52" font-size="16">🏠</text>
    <text x="250" y="50" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">NJOP Bangunan</text>
    <text x="250" y="68" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">Luas Bangunan × Nilai Jual/m²</text>
  </g>

  <!-- Arrow -->
  <path d="M 240,178 L 240,194" stroke="#3fd6ff" stroke-width="2" stroke-dasharray="3 2"/>
  <polygon points="236,194 244,194 240,200" fill="#3fd6ff"/>

  <!-- Step 2: Pengurangan NJOPTKP -->
  <g transform="translate(36, 204)">
    <rect width="408" height="82" rx="10" fill="rgba(255,77,77,0.08)" stroke="rgba(255,77,77,0.3)" stroke-width="1.2"/>
    <text x="204" y="22" fill="#ff4d4d" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">2. PENGURANG WAJIB: NJOPTKP</text>
    <text x="204" y="44" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">
      NJOP untuk Penghitungan Pajak = <tspan fill="#ffb238" font-weight="bold">Total NJOP</tspan> - <tspan fill="#ff4d4d" font-weight="bold">NJOPTKP</tspan>
    </text>
    <text x="204" y="64" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">
      Batas pembebasan pajak per wajib pajak (Umumnya Rp 10.000.000 s.d. Rp 12.000.000)
    </text>
  </g>

  <!-- Arrow -->
  <path d="M 240,286 L 240,302" stroke="#3fd6ff" stroke-width="2" stroke-dasharray="3 2"/>
  <polygon points="236,302 244,302 240,308" fill="#3fd6ff"/>

  <!-- Step 3: NJKP -->
  <g transform="translate(36, 312)">
    <rect width="408" height="96" rx="10" fill="url(#pbbCard)" stroke="#1c3a57" stroke-width="1.2"/>
    <text x="204" y="22" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">3. NILAI JUAL KENA PAJAK (NJKP)</text>

    <!-- NJKP 20% -->
    <rect x="14" y="32" width="180" height="52" rx="8" fill="rgba(63,214,255,0.08)" stroke="rgba(63,214,255,0.2)"/>
    <text x="26" y="52" fill="#3fd6ff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">20%</text>
    <text x="70" y="48" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">NJOP &lt; Rp 1 Miliar</text>
    <text x="70" y="64" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="8.5">Properti hunian biasa</text>

    <!-- NJKP 40% -->
    <rect x="214" y="32" width="180" height="52" rx="8" fill="rgba(255,178,56,0.08)" stroke="rgba(255,178,56,0.2)"/>
    <text x="226" y="52" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">40%</text>
    <text x="270" y="48" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">NJOP ≥ Rp 1 Miliar</text>
    <text x="270" y="64" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="8.5">Properti mewah/komersial</text>
  </g>

  <!-- Arrow -->
  <path d="M 240,408 L 240,424" stroke="#3fd6ff" stroke-width="2" stroke-dasharray="3 2"/>
  <polygon points="236,424 244,424 240,430" fill="#3fd6ff"/>

  <!-- Step 4: Rumus Akhir -->
  <g transform="translate(36, 434)">
    <rect width="408" height="160" rx="12" fill="rgba(61,220,132,0.08)" stroke="rgba(61,220,132,0.4)" stroke-width="1.5"/>
    <text x="204" y="26" fill="#3ddc84" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. FORMULA AKHIR PBB TERUTANG</text>

    <!-- Formula Box -->
    <rect x="18" y="38" width="372" height="42" rx="8" fill="rgba(10,24,40,0.9)" stroke="#1c3a57"/>
    <text x="204" y="64" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      PBB = <tspan fill="#3fd6ff">Tarif (0,5%)</tspan> × <tspan fill="#ffb238">NJKP (20%/40%)</tspan> × <tspan fill="#3ddc84">(NJOP - NJOPTKP)</tspan>
    </text>

    <!-- Contoh Soal Mini -->
    <rect x="18" y="88" width="372" height="60" rx="8" fill="rgba(255,255,255,0.03)"/>
    <text x="28" y="106" fill="#ffb238" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">💡 Contoh Cepat Simulasi:</text>
    <text x="28" y="122" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="9">Total NJOP = Rp 900 Juta | NJOPTKP = Rp 12 Juta | Tarif = 0,5% | NJKP = 20%</text>
    <text x="28" y="138" fill="#3ddc84" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold">PBB = 0,5% × 20% × (900 Jt - 12 Jt = 888 Jt) = 0,1% × 888 Jt = Rp 888.000/thn</text>
  </g>
</svg>
